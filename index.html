<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon 3D</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="wrap">

    <div id="top-bar">
      <span id="level-title">DUNGEON 3D</span>
      <div id="hud-row">
        <div class="hud-item">HP: <span id="hp-val">100</span></div>
        <div class="hud-item">COINS: <span id="coin-val">0</span></div>
        <div class="hud-item">KEYS: <span id="key-val">0/3</span></div>
        <div class="hud-item">POS: <span id="pos-val">-</span></div>
        <div class="hud-item">SCORE: <span id="score-val">0</span></div>
        <div class="hud-item">KILLS: <span id="kill-val">0</span></div>
        <div class="hud-item">AMMO: <span id="ammo-val">30</span></div>
        <div class="hud-item">WAVE: <span id="wave-val">1</span></div>
        <div class="hud-item">LVL: <span id="lvl-val">1</span></div>
      </div>
    </div>

    <div id="pause-wrap">
      <button id="pause-btn" onclick="togglePause()">⏸</button>
    </div>
    
    <div id="powerups" class="hidden">
      <!-- Health refill-->
      <div class="power-btn" id="health-btn" onclick="usePower('health')" title="Full Health (2uses)">
        ❤️
        <span class="count" id="health-count">2</span>
      </div>
      <!-- Ammo Refill -->
       <div class="power-btn" id="ammo-btn" onclick="usePower('ammo')" title="Full Ammo (2 uses)">
        🔫
        <span class="count" id="ammo-count">2</span>
       </div>
       <!-- Shield -->
      <div  class="power-btn" id="shield-btn" onclick="usePower('shield')" title="Shield 20sec (1 use)">
        🛡️
        <span class="count" id="shield-count">1</span>
      </div>

    </div>

    <canvas id="gamecanvas"></canvas>

    <div id="bot-bar">
      <div class="key-badge"><b>W A S D</b> move</div>
      <div class="key-badge"><b>Arrow Keys</b> look</div>
      <div class="key-badge"><b>R</b> restart</div>
      <div class="key-badge"><b>SPACE</b> shoot</div>
    </div>

  </div>
  <script src="js/sound.js"></script>
  <script src="js/map.js"></script>
  <script src="js/player.js"></script>
  <script src="js/raycaster.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/weather.js"></script>  
  <script src="js/game.js"></script>

  <div id="level-complete-screen" class="hidden">
    <div id="lc-panel">
      <div id="lc-banner">LEVEL COMPLETED!</div>
      <div id="lc-level-name">LEVEL 1 — THE DUNGEON</div>
      <div id="lc-score">SCORE: 0</div>
      <div id="lc-kills-stat">KILLS: 0</div>
      <div id="lc-buttons">
        <div class="lc-btn" id="lc-retry" onclick="lcRetry()">
          ↺<span>RETRY</span>
        </div>
        <div class="lc-btn" id="lc-next" onclick="lcNext()">
          ▶<span>NEXT</span>
        </div>
        <div class="lc-btn" id="lc-menu" onclick="lcMenu()">
          ⌂<span>MENU</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
